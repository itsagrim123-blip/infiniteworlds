function applyMobilePerformance(){

    if(!mobileMode)
        return;

    document.body.classList.add(
        "mobileMode"
    );

    // Browser/WebGL friendly mobile defaults.
    VIEW_DISTANCE = 1;

    if(
        typeof renderer !== "undefined" &&
        renderer
    ){

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.0
            )
        );

        renderer.shadowMap.enabled =
            false;
    }

    // Mobile should not try to keep desktop-sized chunks around.
    if(
        typeof CHUNK_SIZE !== "undefined" &&
        typeof VIEW_DISTANCE !== "undefined"
    ){

        // Existing chunk logic will respect VIEW_DISTANCE.
    }

    // Do not touch the desktop controls here. PointerLockControls is
    // initialized later in the module and accessing it now would trigger
    // a temporal-dead-zone ReferenceError on mobile browsers.
}


function setupMobileControls(){

    if(!mobileMode)
        return;

    if(
        typeof camera !== "undefined" &&
        camera
    ){
        mobileLookYaw =
            camera.rotation.y || 0;

        mobileLookPitch =
            camera.rotation.x || 0;
    }

    const joystick =
        document.getElementById(
            "mobileJoystick"
        );

    const knob =
        document.getElementById(
            "mobileJoystickKnob"
        );

    const lookArea =
        document.getElementById(
            "mobileLookArea"
        );

    const jump =
        document.getElementById(
            "mobileJump"
        );

    const flash =
        document.getElementById(
            "mobileFlash"
        );

    const interact =
        document.getElementById(
            "mobileInteract"
        );

    const pause =
        document.getElementById(
            "mobilePause"
        );

    const sprint =
        document.getElementById(
            "mobileSprint"
        );

    if(!joystick || !knob || !lookArea)
        return;


    const resetJoystick = () => {

        mobileJoystick.active =
            false;

        mobileJoystick.pointerId =
            null;

        mobileJoystick.x = 0;
        mobileJoystick.y = 0;

        knob.style.transform =
            "translate3d(0,0,0)";
    };


    const updateJoystick =
        event => {

            const rect =
                joystick.getBoundingClientRect();

            const cx =
                rect.left +
                rect.width / 2;

            const cy =
                rect.top +
                rect.height / 2;

            let dx =
                event.clientX - cx;

            let dy =
                event.clientY - cy;

            const max =
                rect.width * .32;

            const length =
                Math.hypot(
                    dx,
                    dy
                );

            if(length > max){

                dx =
                    dx / length * max;

                dy =
                    dy / length * max;
            }

            mobileJoystick.x =
                dx / max;

            mobileJoystick.y =
                dy / max;

            knob.style.transform =
                `translate3d(${dx}px,${dy}px,0)`;
        };


    joystick.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            mobileJoystick.active =
                true;

            mobileJoystick.pointerId =
                event.pointerId;

            joystick.setPointerCapture(
                event.pointerId
            );

            updateJoystick(event);
        },
        {passive:false}
    );


    joystick.addEventListener(
        "pointermove",
        event => {

            if(
                !mobileJoystick.active ||
                event.pointerId !==
                    mobileJoystick.pointerId
            )
                return;

            event.preventDefault();

            updateJoystick(event);
        },
        {passive:false}
    );


    joystick.addEventListener(
        "pointerup",
        event => {

            if(
                event.pointerId ===
                mobileJoystick.pointerId
            )
                resetJoystick();
        }
    );


    joystick.addEventListener(
        "pointercancel",
        resetJoystick
    );


    // Touch-look area.
    lookArea.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            mobileLook.active =
                true;

            mobileLook.pointerId =
                event.pointerId;

            mobileLook.lastX =
                event.clientX;

            mobileLook.lastY =
                event.clientY;

            lookArea.setPointerCapture(
                event.pointerId
            );
        },
        {passive:false}
    );


    lookArea.addEventListener(
        "pointermove",
        event => {

            if(
                !mobileLook.active ||
                event.pointerId !==
                    mobileLook.pointerId
            )
                return;

            event.preventDefault();

            const dx =
                event.clientX -
                mobileLook.lastX;

            const dy =
                event.clientY -
                mobileLook.lastY;

            mobileLook.lastX =
                event.clientX;

            mobileLook.lastY =
                event.clientY;

            // Mobile look has its own camera angles. Do not access the
            // desktop `pitch`/`yaw` bindings here because this handler can
            // run before those bindings are initialized.
            mobileLookYaw -=
                dx * .004;

            mobileLookPitch -=
                dy * .004;

            mobileLookPitch =
                THREE.MathUtils.clamp(
                    mobileLookPitch,
                    -1.35,
                    1.35
                );

            if(
                typeof camera !== "undefined" &&
                camera
            ){

                camera.rotation.set(
                    mobileLookPitch,
                    mobileLookYaw,
                    0,
                    "YXZ"
                );
            }
        },
        {passive:false}
    );


    const endLook = event => {

        if(
            event.pointerId ===
            mobileLook.pointerId
        ){

            mobileLook.active =
                false;

            mobileLook.pointerId =
                null;
        }
    };

    lookArea.addEventListener(
        "pointerup",
        endLook
    );

    lookArea.addEventListener(
        "pointercancel",
        endLook
    );


    function bindButton(
        element,
        callback
    ){

        if(!element)
            return;

        element.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();
                event.stopPropagation();

                callback(true);
            },
            {passive:false}
        );

        element.addEventListener(
            "pointerup",
            event => {

                event.preventDefault();

                callback(false);
            },
            {passive:false}
        );

        element.addEventListener(
            "pointercancel",
            () => callback(false)
        );
    }


    bindButton(
        jump,
        pressed => {

            mobileButtons.jump =
                pressed;

            if(pressed){
                keys.Space = true;

                setTimeout(
                    () => {
                        keys.Space = false;
                    },
                    120
                );
            }
        }
    );


    bindButton(
        flash,
        pressed => {

            if(pressed){
                keys.KeyF = true;

                setTimeout(
                    () => {
                        keys.KeyF = false;
                    },
                    80
                );
            }
        }
    );


    bindButton(
        interact,
        pressed => {

            if(pressed){
                keys.KeyE = true;

                setTimeout(
                    () => {
                        keys.KeyE = false;
                    },
                    80
                );
            }
        }
    );


    bindButton(
        sprint,
        pressed => {

            mobileButtons.sprint =
                pressed;
        }
    );


    if(pause){

        pause.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();
                event.stopPropagation();

                if(
                    typeof gamePaused !==
                        "undefined"
                ){

                    gamePaused =
                        !gamePaused;

                    const menu =
                        document.getElementById(
                            "pauseMenu"
                        );

                    if(menu)
                        menu.style.display =
                            gamePaused
                                ? "flex"
                                : "none";
                }
            },
            {passive:false}
        );
    }
}


function updateMobileMovement(){

    if(!mobileMode)
        return;

    if(
        typeof keys === "undefined"
    )
        return;

    // Map joystick to the same movement keys used by desktop.
    keys.KeyW =
        mobileJoystick.y < -.18;

    keys.KeyS =
        mobileJoystick.y > .18;

    keys.KeyA =
        mobileJoystick.x < -.18;

    keys.KeyD =
        mobileJoystick.x > .18;

    keys.ShiftLeft =
        !!mobileButtons.sprint;
}


function mobileResize(){

    if(!mobileMode)
        return;

    if(
        typeof renderer !== "undefined" &&
        renderer &&
        typeof camera !== "undefined"
    ){

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;

        camera.aspect =
            width / height;

        camera.updateProjectionMatrix();

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.0
            )
        );

        renderer.setSize(
            width,
            height,
            false
        );
    }
}



// ============================================================
// DEVELOPER CONSOLE
// ============================================================

const devConsole =
    document.getElementById("devConsole");

const devOutput =
    document.getElementById("devConsoleOutput");

const devInput =
    document.getElementById("devConsoleInput");

const devForm =
    document.getElementById("devConsoleForm");


function devPrint(message){

    if(!devOutput)
        return;

    devOutput.textContent +=
        "\n> " + message;

    devOutput.scrollTop =
        devOutput.scrollHeight;
}


function toggleDeveloperConsole(){

    if(!devConsole)
        return;

    developerMode =
        !developerMode;

    devConsole.classList.toggle(
        "open",
        developerMode
    );

    if(developerMode){

        devPrint(
            "Developer console enabled. Type 'help'."
        );

        setTimeout(() => {

            devInput.focus();

        }, 20);
    }
}


function setWorldTime(hours){

    let value =
        Number(hours);

    if(!Number.isFinite(value)){

        devPrint(
            "Usage: time <0-24>"
        );

        return;
    }

    value =
        ((value % 24) + 24) % 24;

    worldTime =
        value;

    updateSunMoon();

    updateDayNight(0);

    devPrint(
        "World time set to " +
        value.toFixed(2) +
        ":00"
    );
}


function executeDeveloperCommand(raw){

    const command =
        raw.trim();

    if(!command)
        return;

    devPrint(command);

    const parts =
        command.split(/\s+/);

    const name =
        parts[0].toLowerCase();

    const args =
        parts.slice(1);


    switch(name){

        case "help":

            devPrint(
                "Commands:\n" +
                "time <0-24>        Set world time\n" +
                "speed <number>     Set player speed multiplier\n" +
                "speed reset        Reset speed\n" +
                "tp <x> <z>          Teleport player\n" +
                "pos                 Show player position\n" +
                "biome               Show current biome\n" +
                "fps                 Show FPS estimate\nperf                Apply performance mode\n" +
                "god                 Toggle collision bypass\n" +
                "regen               Regenerate nearby chunks\n" +
                "grass               Rebuild grass\n" +
                "clear               Clear console"
            );

            break;


        case "time":

            setWorldTime(
                args[0]
            );

            break;


        case "speed":{

            if(
                args[0] &&
                args[0].toLowerCase() === "reset"
            ){

                developerSpeedMultiplier =
                    1;

                devPrint(
                    "Speed reset to 1.0x."
                );

                break;
            }

            const multiplier =
                Number(args[0]);

            if(
                !Number.isFinite(multiplier) ||
                multiplier <= 0
            ){

                devPrint(
                    "Usage: speed <positive number>"
                );

                break;
            }

            developerSpeedMultiplier =
                THREE.MathUtils.clamp(
                    multiplier,
                    .1,
                    10
                );

            devPrint(
                "Speed = " +
                developerSpeedMultiplier.toFixed(2) +
                "x"
            );

            break;
        }


        case "tp":{

            const tx =
                Number(args[0]);

            const tz =
                Number(args[1]);

            if(
                !Number.isFinite(tx) ||
                !Number.isFinite(tz)
            ){

                devPrint(
                    "Usage: tp <x> <z>"
                );

                break;
            }

            camera.position.x =
                tx;

            camera.position.z =
                tz;

            camera.position.y =
                terrainHeight(
                    tx,
                    tz
                ) + 1.7;

            updateChunks();

            devPrint(
                "Teleported to " +
                tx.toFixed(1) +
                ", " +
                tz.toFixed(1)
            );

            break;
        }


        case "pos":

            devPrint(
                "Position: x=" +
                camera.position.x.toFixed(2) +
                " y=" +
                camera.position.y.toFixed(2) +
                " z=" +
                camera.position.z.toFixed(2)
            );

            break;


        case "biome":{

            const current =
                biomeAt(
                    camera.position.x,
                    camera.position.z
                );

            devPrint(
                "Biome: " + current
            );

            break;
        }


        case "fps":
            devPrint("FPS command: use the browser Performance panel for an exact frame rate.");
            break;



        case "perf":

            VIEW_DISTANCE = 1;
            renderer.setPixelRatio(
                Math.min(
                    devicePixelRatio,
                    1.0
                )
            );

            renderer.shadowMap.enabled = false;

            devPrint(
                "Performance mode enabled: " +
                "1-chunk radius, 1.0x pixel ratio, shadows off."
            );

            break;

        case "god":

            developerGodMode =
                !developerGodMode;

            devPrint(
                "God/collision bypass: " +
                (
                    developerGodMode
                        ? "ON"
                        : "OFF"
                )
            );

            break;


        case "regen":

            updateChunks();

            devPrint(
                "Nearby chunks refreshed."
            );

            break;


        case "grass":

            try{

                createGrassField();
                updateGrassField();

                devPrint(
                    "Grass field rebuilt."
                );

            }catch(error){

                console.error(error);

                devPrint(
                    "Grass rebuild failed: " +
                    error.message
                );
            }

            break;


        case "clear":

            devOutput.textContent = "";

            break;


        default:

            devPrint(
                "Unknown command. Type 'help'."
            );
    }
}


if(devForm){

    devForm.addEventListener(
        "submit",
        event => {

            event.preventDefault();

            executeDeveloperCommand(
                devInput.value
            );

            devInput.value = "";
        }
    );
}


window.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "F2" ||
            event.key === "`" ||
            event.key === "~"
        ){

            event.preventDefault();

            toggleDeveloperConsole();

            return;
        }


        if(
            developerMode &&
            document.activeElement === devInput
        ){

            if(event.key === "Escape"){

                toggleDeveloperConsole();
            }

            return;
        }
    }
);


// ============================================================
// MAIN LOOP
// ============================================================

function animate(){

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();

    const delta =
        Math.min(
            (now-lastTime)/1000,
            .05
        );

    lastTime=now;


    if(gameStarted && !gamePaused){

        updatePlayer(delta);

        updateChunks();

        updateNPCs(delta);

        updateDayNight(delta);

        updateClouds(delta);

        updateSunMoon();


        updateGrassField(delta);
        updateGameAudio(delta);

        updateMobileMovement();
    }


    renderer.render(
        scene,
        camera
    );
}


animate();

<script>
window.addEventListener("error", function(event){
    const box = document.getElementById("fatalStartupError");
    if(box){
        box.style.display = "block";
        box.textContent =
            "GAME STARTUP ERROR\n" +
            (event.error?.stack || event.message || "Unknown error");
    }
});
window.addEventListener("unhandledrejection", function(event){
    const box = document.getElementById("fatalStartupError");
    if(box){
        box.style.display = "block";
        box.textContent =
            "GAME STARTUP ERROR\n" +
            String(event.reason || "Unhandled promise rejection");
    }
});
</script>

<script>
window.addEventListener(
    "resize",
    function(){
        if(typeof mobileResize === "function")
            mobileResize();
    }
);

document.addEventListener(
    "touchmove",
    function(event){
        if(
            document.body.classList.contains(
                "mobileMode"
            )
        ){
            event.preventDefault();
        }
    },
    {passive:false}
);
</script>
