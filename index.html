<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>INFINITE FRONTIER</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}
#game{position:fixed;inset:0}
#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:7px;
    height:7px;
    transform:translate(-50%,-50%);
    border:1px solid white;
    border-radius:50%;
    z-index:20;
    pointer-events:none;
}
#hud{
    position:fixed;
    left:18px;
    top:16px;
    z-index:30;
    color:#fff;
    font-size:13px;
    line-height:1.6;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
}
#hud b{font-size:16px;letter-spacing:2px}
#status{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    color:#fff;
    z-index:40;
    text-shadow:0 2px 5px #000;
    opacity:0;
    transition:opacity .25s;
    pointer-events:none;
}
#start,
#pauseMenu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        radial-gradient(circle at center,
        rgba(30,50,60,.22),
        rgba(0,0,0,.95));
    color:#fff;
}

#pauseMenu{
    display:none;
    z-index:150;
    backdrop-filter:blur(5px);
}

.menu-panel{
    width:min(430px,90vw);
    padding:38px 42px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(8,12,16,.78);
    box-shadow:0 20px 80px rgba(0,0,0,.55);
    border-radius:12px;
    text-align:center;
}

#start h1,
#pauseMenu h1{
    margin:0 0 8px;
    font-size:52px;
    letter-spacing:9px;
    text-align:center;
}

#pauseMenu h1{
    font-size:34px;
    letter-spacing:5px;
}

.menu-subtitle{
    color:#aaa;
    margin:0 0 25px;
    font-size:13px;
}

.menu-button{
    display:block;
    width:100%;
    padding:14px 20px;
    margin:9px 0;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    cursor:pointer;
    border-radius:6px;
    font-size:15px;
    transition:.15s;
}

.menu-button:hover{
    background:#fff;
    color:#000;
    transform:translateY(-1px);
}

.menu-button.danger:hover{
    background:#b33;
    border-color:#b33;
    color:#fff;
}

#settingsPanel{
    display:none;
    position:fixed;
    inset:0;
    z-index:180;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(7px);
}

.settings-panel{
    width:min(520px,92vw);
    max-height:90vh;
    overflow:auto;
    padding:30px;
    background:#10161b;
    border:1px solid rgba(255,255,255,.2);
    border-radius:12px;
    color:white;
}

.settings-panel h2{
    margin-top:0;
    letter-spacing:3px;
}

.setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.setting-row label{
    color:#ddd;
}

.setting-row select,
.setting-row input[type="range"]{
    width:190px;
}

.setting-value{
    min-width:42px;
    text-align:right;
    color:#aaa;
}

.settings-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.settings-actions .menu-button{
    margin:0;
}

#loading{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    color:white;
    background:#000;
}

/* Developer console */
#devConsole{
    position:fixed;
    left:18px;
    bottom:18px;
    width:min(560px, calc(100vw - 36px));
    max-height:46vh;
    z-index:10000;
    display:none;
    font-family:Consolas,monospace;
    background:rgba(8,12,16,.94);
    border:1px solid rgba(255,255,255,.2);
    border-radius:10px;
    box-shadow:0 10px 35px rgba(0,0,0,.45);
    color:#d9f5d0;
    overflow:hidden;
}
#devConsole.open{display:block;}
#devConsoleHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 12px;
    background:rgba(255,255,255,.06);
    font-weight:700;
}
#devConsoleOutput{
    height:180px;
    overflow:auto;
    padding:10px 12px;
    white-space:pre-wrap;
    font-size:12px;
    line-height:1.45;
}
#devConsoleForm{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid rgba(255,255,255,.1);
}
#devConsoleInput{
    flex:1;
    min-width:0;
    background:#101820;
    color:#fff;
    border:1px solid rgba(255,255,255,.2);
    border-radius:6px;
    padding:8px 10px;
    font:inherit;
    outline:none;
}
#devConsoleForm button{
    background:#2f7d32;
    color:white;
    border:0;
    border-radius:6px;
    padding:8px 13px;
    cursor:pointer;
    font:inherit;
}

#fatalStartupError{
    display:none;
    position:fixed;
    left:20px;
    right:20px;
    bottom:20px;
    z-index:99999;
    padding:14px 16px;
    background:rgba(80,8,8,.96);
    color:#fff;
    border:1px solid rgba(255,140,140,.6);
    border-radius:8px;
    font:13px/1.5 Consolas,monospace;
    white-space:pre-wrap;
}

/* ============================================================
   MOBILE GAME UI
   ============================================================ */

#mobileControls{
    display:none;
    position:fixed;
    inset:0;
    z-index:9000;
    pointer-events:none;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

body.mobileMode #mobileControls{
    display:block;
}

#mobileJoystick{
    position:absolute;
    left:22px;
    bottom:24px;
    width:132px;
    height:132px;
    border-radius:50%;
    background:rgba(255,255,255,.13);
    border:2px solid rgba(255,255,255,.28);
    box-shadow:0 6px 25px rgba(0,0,0,.25);
    pointer-events:auto;
    touch-action:none;
}

#mobileJoystickKnob{
    position:absolute;
    left:50%;
    top:50%;
    width:58px;
    height:58px;
    margin-left:-29px;
    margin-top:-29px;
    border-radius:50%;
    background:rgba(255,255,255,.42);
    border:2px solid rgba(255,255,255,.55);
    box-shadow:0 4px 15px rgba(0,0,0,.25);
    transform:translate3d(0,0,0);
}

#mobileLookArea{
    position:absolute;
    right:0;
    top:0;
    width:64%;
    height:100%;
    pointer-events:auto;
    touch-action:none;
}

.mobileButton{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(15,20,25,.52);
    color:white;
    font:700 12px Arial,sans-serif;
    box-shadow:0 5px 18px rgba(0,0,0,.28);
    pointer-events:auto;
    touch-action:none;
    display:flex;
    align-items:center;
    justify-content:center;
}

.mobileButton:active{
    background:rgba(255,255,255,.3);
    transform:scale(.94);
}

#mobileJump{
    right:26px;
    bottom:28px;
}

#mobileFlash{
    right:98px;
    bottom:92px;
}

#mobileInteract{
    right:28px;
    bottom:102px;
}

#mobilePause{
    right:18px;
    top:18px;
    width:48px;
    height:48px;
}

#mobileSprint{
    left:170px;
    bottom:32px;
    width:62px;
    height:52px;
}

#mobileHint{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    padding:7px 12px;
    border-radius:20px;
    background:rgba(0,0,0,.35);
    color:rgba(255,255,255,.82);
    font:11px Arial,sans-serif;
    pointer-events:none;
}

@media (orientation: portrait){
    #mobileHint::after{
        content:" Rotate your phone for the best experience";
    }
}

@media (orientation: landscape){
    #mobileHint{
        opacity:.55;
    }
}

/* Hide desktop pointer-lock instructions/controls on phones. */
body.mobileMode #desktopControls,
body.mobileMode .desktopOnly,
body.mobileMode #crosshair{
    display:none !important;
}

</style>
</head>

</div>

<script type="importmap">

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/controls/PointerLockControls.js";


// ============================================================
// CONFIGURATION
// ============================================================

const CHUNK_SIZE = 100;
let VIEW_DISTANCE = 1;
const WORLD_SEED = 918273645;

const PLAYER_HEIGHT = 2.65;
const WALK_SPEED = 8;
const SPRINT_SPEED = 15;

const chunks = new Map();
const npcs = [];
const generatedNPCIds = new Set();

// World collision data. Each chunk owns its colliders so unloading a
// chunk also removes its collision geometry.
const chunkColliders = new Map();

const PLAYER_RADIUS = 0.42;

let flashlightOn = false;
let gameStarted = false;
let worldTime = 8.0;

let cloudLayer = null;
let cloudMaterials = [];

let sunMesh = null;
let moonMesh = null;
let starField = null;
let stars = null;
let grassField = null;
let grassMaterials = [];
let cloudTexture = null;
let cloudMaterial = null;

// Real audio files placed in ./audio/
const AUDIO_FILES = {
    forestFootstep: "./audio/forest_footstep.mp3",
    desertFootstep: "./audio/desert_footstep.mp3",
    snowFootstep: "./audio/snow_footstep.mp3",

    forestAmbience: "./audio/forest_ambience.mp3",
    desertAmbience: "./audio/desert_ambience.mp3",
    snowAmbience: "./audio/snow_ambience.mp3",

    nightAmbience: "./audio/night_ambience.mp3"
};

const GAME_AUDIO = {};
let currentAmbience = null;
let audioStarted = false;
let footstepTimer = 0;
let lastAudioBiome = null;

let gamePaused = false;

let isMobileDevice =
    /Android|iPhone|iPad|iPod|Windows Phone/i.test(
        navigator.userAgent
    ) ||
    (
        navigator.maxTouchPoints > 0 &&
        window.matchMedia("(pointer: coarse)").matches
    );

let mobileMode = isMobileDevice;

let mobileJoystick = {
    active:false,
    pointerId:null,
    x:0,
    y:0
};

let mobileLook = {
    active:false,
    pointerId:null,
    lastX:0,
    lastY:0
};

let mobileLookYaw = 0;
let mobileLookPitch = 0;

let mobileButtons = {
    jump:false,
    flashlight:false,
    interact:false
};


let developerMode = false;
let developerSpeedMultiplier = 1.0;
let developerGodMode = false;

let settingsReturn = "main";
let rendererQuality = "medium";
let resolutionScale = 1.0;
let viewDistanceSetting = 2;
let shadowsEnabled = true;
let fogEnabled = true;

let lastTime = performance.now();


// ============================================================
// SCENE
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x86b9dc);

scene.fog = new THREE.Fog(
    0x86b9dc,
    90,
    360
);


const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    .1,
    1200
);

camera.position.set(
    0,
    PLAYER_HEIGHT,
    8
);


const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.25)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
    THREE.BasicShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.05;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


// ============================================================
// LIGHTING
// ============================================================

const skyLight =
    new THREE.HemisphereLight(
        0xbddcff,
        0x526044,
        1.5
    );

scene.add(skyLight);


const sun =
    new THREE.DirectionalLight(
        0xfff1cf,
        2.8
    );

sun.position.set(
    150,
    220,
    80
);

sun.castShadow = true;

sun.shadow.mapSize.width = 512;
sun.shadow.mapSize.height = 512;

sun.shadow.camera.left = -180;
sun.shadow.camera.right = 180;
sun.shadow.camera.top = 180;
sun.shadow.camera.bottom = -180;

sun.shadow.camera.near = 10;
sun.shadow.camera.far = 600;

scene.add(sun);


// ============================================================
// FLASHLIGHT
// ============================================================

const flashlight =
    new THREE.SpotLight(
        0xffffff,
        0,
        65,
        Math.PI / 7,
        .55,
        1.2
    );

flashlight.position.set(
    0,
    0,
    0
);

flashlight.castShadow = false;

flashlight.shadow.mapSize.width = 512;
flashlight.shadow.mapSize.height = 512;

camera.add(flashlight);

scene.add(camera);


const flashlightTarget =
    new THREE.Object3D();

flashlightTarget.position.set(
    0,
    0,
    -30
);

camera.add(flashlightTarget);

flashlight.target =
    flashlightTarget;


createCloudLayer();

try{
    applyMobilePerformance();
    setupMobileControls();
}catch(error){
    console.warn(
        "Mobile setup partially disabled:",
        error
    );
}

createSunMoon();

// ============================================================
// CONTROLS
// ============================================================

const controls =
    new PointerLockControls(
        camera,
        document.body
    );


// ============================================================
// SEEDED RANDOM
// ============================================================

function hash(x,z,extra=0){

    let n =
        Math.floor(x) * 374761393 +
        Math.floor(z) * 668265263 +
        WORLD_SEED * 1442695041 +
        extra * 1013904223;

    n =
        (n ^ (n >>> 13)) * 1274126177;

    n ^=
        n >>> 16;

    return (
        (n >>> 0) / 4294967296
    );
}


function rand(x,z,min,max,extra=0){

    return min +
        hash(x,z,extra) *
        (max-min);
}


function noise(x,z){

    const x0 = Math.floor(x);
    const z0 = Math.floor(z);

    const sx = x-x0;
    const sz = z-z0;

    const a = hash(x0,z0);
    const b = hash(x0+1,z0);
    const c = hash(x0,z0+1);
    const d = hash(x0+1,z0+1);

    const ux = sx*sx*(3-2*sx);
    const uz = sz*sz*(3-2*sz);

    return THREE.MathUtils.lerp(
        THREE.MathUtils.lerp(a,b,ux),
        THREE.MathUtils.lerp(c,d,ux),
        uz
    );
}


// ============================================================
// REAL GAME AUDIO
// ============================================================

function setupGameAudio(){

    if(audioStarted)
        return;

    for(
        const [name, path] of Object.entries(AUDIO_FILES)
    ){

        const audio =
            new Audio(path);

        audio.preload = "auto";

        GAME_AUDIO[name] = audio;
    }

    GAME_AUDIO.forestAmbience.loop = true;
    GAME_AUDIO.desertAmbience.loop = true;
    GAME_AUDIO.snowAmbience.loop = true;
    GAME_AUDIO.nightAmbience.loop = true;

    GAME_AUDIO.forestAmbience.volume = 0;
    GAME_AUDIO.desertAmbience.volume = 0;
    GAME_AUDIO.snowAmbience.volume = 0;
    GAME_AUDIO.nightAmbience.volume = 0;

    audioStarted = true;
}


function playAudioFile(
    audio,
    volume = .5
){

    if(!audio)
        return;

    audio.volume = volume;

    audio.currentTime = 0;

    const promise =
        audio.play();

    if(promise && promise.catch){

        promise.catch(
            error => {

                console.warn(
                    "Audio could not play:",
                    audio.src,
                    error
                );
            }
        );
    }
}


function playFootstep(){

    if(!audioStarted)
        return;

    const biome =
        biomeAt(
            camera.position.x,
            camera.position.z
        );

    let sound = null;

    if(biome === "desert"){

        sound =
            GAME_AUDIO.desertFootstep;

    }else if(biome === "snow"){

        sound =
            GAME_AUDIO.snowFootstep;

    }else{

        sound =
            GAME_AUDIO.forestFootstep;
    }

    playAudioFile(
        sound,
        .5
    );
}


function stopAmbience(
    audio
){

    if(!audio)
        return;

    audio.pause();
    audio.currentTime = 0;
}


function setAmbience(
    target
){

    if(!target || currentAmbience === target)
        return;

    if(currentAmbience){

        currentAmbience.volume = 0;

        stopAmbience(
            currentAmbience
        );
    }

    currentAmbience = target;

    target.loop = true;
    target.volume = .34;

    const promise =
        target.play();

    if(promise && promise.catch){

        promise.catch(
            error => {

                console.warn(
                    "Ambient audio could not play:",
                    target.src,
                    error
                );
            }
        );
    }
}


function updateBiomeAudio(){

    if(
        !audioStarted ||
        !gameStarted ||
        gamePaused
    )
        return;

    const biome =
        biomeAt(
            camera.position.x,
            camera.position.z
        );

    if(
        biome === lastAudioBiome &&
        currentAmbience
    )
        return;

    lastAudioBiome = biome;

    if(biome === "desert"){

        setAmbience(
            GAME_AUDIO.desertAmbience
        );

    }else if(biome === "snow"){

        setAmbience(
            GAME_AUDIO.snowAmbience
        );

    }else{

        setAmbience(
            GAME_AUDIO.forestAmbience
        );
    }
}


function updateNightAudio(){

    if(
        !audioStarted ||
        !gameStarted ||
        gamePaused
    )
        return;

    const sun =
        Math.sin(
            (worldTime / 24) *
            Math.PI * 2 -
            Math.PI / 2
        );

    const daylight =
        THREE.MathUtils.clamp(
            sun * .5 + .5,
            0,
            1
        );

    const night =
        1 - daylight;

    const nightAudio =
        GAME_AUDIO.nightAmbience;

    nightAudio.volume =
        .42 * night;

    if(
        night > .2 &&
        nightAudio.paused
    ){

        const promise =
            nightAudio.play();

        if(promise && promise.catch)
            promise.catch(() => {});
    }

    if(
        night <= .2 &&
        !nightAudio.paused
    ){

        nightAudio.pause();
        nightAudio.currentTime = 0;
    }
}


function updateGameAudio(delta){

    if(
        !audioStarted ||
        !gameStarted ||
        gamePaused
    )
        return;

    updateBiomeAudio();
    updateNightAudio();


    const moving =
        keys.KeyW ||
        keys.KeyA ||
        keys.KeyS ||
        keys.KeyD;

    if(!moving){

        footstepTimer = 0;

        return;
    }


    footstepTimer -= delta;

    if(footstepTimer <= 0){

        const sprinting =
            keys.ShiftLeft ||
            keys.ShiftRight;

        playFootstep();

        footstepTimer =
            sprinting
                ? .28
                : .43;
    }
}


// Start all audio only from a user interaction.
// Browsers allow this because PLAY/LOAD is a click.
function startGameAudio(){

    setupGameAudio();

    updateBiomeAudio();
    updateNightAudio();
}

function createCloudTexture(){

    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 128;

    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,256,128);

    ctx.fillStyle = "rgba(255,255,255,.88)";

    const puffs = [
        [55,72,28],
        [82,56,34],
        [116,65,38],
        [150,55,30],
        [180,72,26],
        [105,82,42]
    ];

    for(const [x,y,r] of puffs){
        ctx.beginPath();
        ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fill();
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.needsUpdate = true;

    return texture;
}


function createCloud(){

    const group =
        new THREE.Group();

    if(!cloudTexture){

        cloudTexture =
            createCloudTexture();
    }

    if(!cloudMaterial){

        cloudMaterial =
            new THREE.SpriteMaterial({
                map: cloudTexture,
                transparent:true,
                opacity:.82,
                depthWrite:false,
                fog:true
            });

        cloudMaterials.push(
            cloudMaterial
        );
    }

    const sprite =
        new THREE.Sprite(
            cloudMaterial
        );

    const size =
        28 + Math.random()*34;

    sprite.scale.set(
        size,
        size*.5,
        1
    );

    group.add(sprite);

    group.position.set(
        camera.position.x +
            (Math.random()-.5)*700,
        105 + Math.random()*55,
        camera.position.z +
            (Math.random()-.5)*700
    );

    group.userData = {
        speed:.7 + Math.random()*1.1,
        baseY:group.position.y,
        phase:Math.random()*Math.PI*2
    };

    cloudLayer.add(group);
}

function createCloudLayer(){

    cloudLayer = new THREE.Group();

    scene.add(cloudLayer);

    for(let i=0;i<18;i++){
        createCloud();
    }
}


function updateClouds(delta){

    if(!cloudLayer) return;

    for(const cloud of cloudLayer.children){

        cloud.position.x +=
            cloud.userData.speed * delta;

        cloud.position.y =
            cloud.userData.baseY +
            Math.sin(
                performance.now()*.00015 +
                cloud.userData.phase
            )*.8;

        const dx =
            cloud.position.x - camera.position.x;

        const dz =
            cloud.position.z - camera.position.z;

        if(dx > 500)
            cloud.position.x -= 1000;

        if(dx < -500)
            cloud.position.x += 1000;

        if(dz > 500)
            cloud.position.z -= 1000;

        if(dz < -500)
            cloud.position.z += 1000;
    }

    const daylight =
        Math.max(
            .08,
            Math.sin(
                (worldTime/24)*Math.PI*2 -
                Math.PI/2
            )*.9 + .25
        );

    for(const material of cloudMaterials){
        material.opacity =
            .45 + daylight*.4;
    }
}

function updateSkyBodies(){

    if(!sunMesh || !moonMesh)
        return;

    const angle =
        (worldTime / 24) *
        Math.PI * 2 -
        Math.PI/2;

    const radius = 620;

    // Sun rises in the east and sets in the west.
    const sunX =
        Math.cos(angle) * radius;

    const sunY =
        Math.sin(angle) * radius;

    const sunZ = -180;

    sunMesh.position.set(
        camera.position.x + sunX,
        Math.max(
            -100,
            sunY
        ),
        camera.position.z + sunZ
    );


    // Moon is opposite the sun.
    moonMesh.position.set(
        camera.position.x - sunX,
        Math.max(
            -100,
            -sunY
        ),
        camera.position.z + sunZ
    );


    const daylight =
        THREE.MathUtils.clamp(
            Math.sin(angle)*.5+.5,
            0,
            1
        );

    const night =
        1-daylight;

    moonMesh.material.opacity =
        .35 + night*.65;

    moonMesh.material.transparent = true;

    stars.material.opacity =
        night*.9;


    // Sun color becomes warmer near sunrise/sunset.
    if(daylight < .35){

        sunMesh.material.color.setHex(
            0xffb45c

    }else{

        sunMesh.material.color.setHex(
            0xfff2b0
        );
    }
}

let grassTexture = null;
let grassMaterial = null;
let grassDummy = new THREE.Object3D();

function setupGrassMaterial(){
    const canvas = document.createElement("canvas");
    canvas.width = 32;
    canvas.height = 64;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,32,64);
    ctx.fillStyle = "#4f8f3d";
    for(let i=0;i<7;i++){
        const x=5+i*3.7;
        ctx.beginPath();
        ctx.moveTo(x-2,63);
        ctx.lineTo(x,8+(i%3)*5);
        ctx.lineTo(x+2.5,63);
        ctx.closePath();
        ctx.fill();
    }
    grassTexture = new THREE.CanvasTexture(canvas);
    grassTexture.colorSpace = THREE.SRGBColorSpace;
    grassTexture.needsUpdate = true;
    grassMaterial = new THREE.MeshLambertMaterial({
        map: grassTexture,
        transparent: true,
        alphaTest: .35,
        side: THREE.DoubleSide,
        depthWrite: true
    });
}

function createGrassField(){
    if(grassField){
        scene.remove(grassField);
        grassField.geometry?.dispose();
    }
    if(!grassMaterial) setupGrassMaterial();

    // Two crossed planes are represented by two instanced meshes.
    const geometry = new THREE.PlaneGeometry(1.0,1.55);
    const group = new THREE.Group();
    const count = 140;
    const positions = [];

    for(let i=0;i<count;i++){
        positions.push({
            x:(Math.random()-.5)*300,
            z:(Math.random()-.5)*300,
            scale:.55+Math.random()*1.0,
            rot:Math.random()*Math.PI,
            phase:Math.random()*Math.PI*2
        });
    }

    for(let pass=0;pass<2;pass++){
        const mesh = new THREE.InstancedMesh(
            geometry,
            grassMaterial,
            count
        );
        mesh.castShadow=false;
        mesh.receiveShadow=false;
        mesh.frustumCulled=true;

        for(let i=0;i<count;i++){
            const p=positions[i];
            grassDummy.position.set(p.x,0,p.z);
            grassDummy.rotation.set(0,p.rot+pass*Math.PI/2,0);
            grassDummy.scale.set(p.scale,p.scale,p.scale);
            grassDummy.updateMatrix();
            mesh.setMatrixAt(i,grassDummy.matrix);
        }
        mesh.instanceMatrix.needsUpdate=true;
        mesh.userData.positions=positions;
        mesh.userData.pass=pass;
        group.add(mesh);
    }

    group.userData.cellSize=90;
    grassField=group;
    scene.add(group);
}

function updateGrassField(){
    if(!grassField) return;

    const cellSize=80;
    const centerX=Math.floor(camera.position.x/cellSize)*cellSize;
    const centerZ=Math.floor(camera.position.z/cellSize)*cellSize;
    grassField.position.set(centerX,0,centerZ);

    const now=performance.now()*.001;

    for(const mesh of grassField.children){
        const positions=mesh.userData.positions;
        const pass=mesh.userData.pass;
        for(let i=0;i<positions.length;i++){
            const p=positions[i];
            const wx=centerX+p.x;
            const wz=centerZ+p.z;
            const h=terrainHeight(wx,wz)+.02;
            const sway=Math.sin(now*.9+p.phase)*.035;
            grassDummy.position.set(p.x,h,p.z);
            grassDummy.rotation.set(sway,p.rot+pass*Math.PI/2,sway*.6);
            grassDummy.scale.set(p.scale,p.scale,p.scale);
            grassDummy.updateMatrix();
            mesh.setMatrixAt(i,grassDummy.matrix);
        }
        mesh.instanceMatrix.needsUpdate=true;
    }
}

        (worldTime/24)*Math.PI*2 - Math.PI/2;

    const radius=260;

    const horizontal=Math.cos(angle)*radius;
    const vertical=Math.sin(angle)*radius;

    const forward=new THREE.Vector3();
    camera.getWorldDirection(forward);

    forward.y=0;

    if(forward.lengthSq()<0.001)
        forward.set(0,0,-1);

    forward.normalize();

    const right=new THREE.Vector3(
        -forward.z,
        0,
        forward.x
    );

    // Keep celestial objects in front of the camera so they are
    // immediately visible during testing.
    sunMesh.position.copy(camera.position);
    sunMesh.position.addScaledVector(forward,220);
    sunMesh.position.addScaledVector(right,horizontal);
    sunMesh.position.y += vertical+95;

    moonMesh.position.copy(camera.position);
    moonMesh.position.addScaledVector(forward,220);
    moonMesh.position.addScaledVector(right,-horizontal);
    moonMesh.position.y += -vertical+95;

    const daylight=THREE.MathUtils.clamp(
        Math.sin(angle)*.5+.5,
        0,
        1
    );

    const night=1-daylight;

    sunMesh.visible=daylight>.03;
    moonMesh.visible=night>.04;

    sunMesh.material.opacity=
        THREE.MathUtils.clamp(daylight*1.15,0,1);

    moonMesh.material.opacity=
        THREE.MathUtils.clamp(night,0,.95);

    if(daylight<.3)
        sunMesh.material.color.setHex(0xffb45e);
    else
        sunMesh.material.color.setHex(0xffffff);

    if(starField){

        starField.position.copy(camera.position);

        starField.material.opacity=
            Math.min(.9,night);
    }
}


// ============================================================
// CONTINENT NOISE
// ============================================================
// Lightweight deterministic value noise used by biomeAt().
// Kept self-contained so the game can start without external
// noise-library globals.
function continentNoise(x, z){

    function hash(ix, iz){

        let h =
            Math.imul(
                ix | 0,
                374761393
            ) ^
            Math.imul(
                iz | 0,
                668265263
            );

        h =
            (h ^ (h >>> 13)) | 0;

        h =
            Math.imul(
                h,
                1274126177
            );

        h =
            (h ^ (h >>> 16)) | 0;

        return (
            (h >>> 0) / 4294967295
        );
    }

    const ix =
        Math.floor(x);

    const iz =
        Math.floor(z);

    const fx =
        x - ix;

    const fz =
        z - iz;

    const smooth =
        t => t * t * (3 - 2 * t);

    const sx =
        smooth(fx);

    const sz =
        smooth(fz);

    const a =
        hash(ix, iz);

    const b =
        hash(ix + 1, iz);

    const c =
        hash(ix, iz + 1);

    const d =
        hash(ix + 1, iz + 1);

    const ab =
        a + (b - a) * sx;

    const cd =
        c + (d - c) * sx;

    return (
        ab + (cd - ab) * sz
    );
}

function biomeAt(x,z){

    const n =
        continentNoise(x,z);

    const b =
        noise(
            x*.004,
            z*.004
        );

    /*
        Forest:
        most of the world

        Desert:
        dry low-frequency areas

        Snow:
        cold high-frequency regions
    */

    if(
        Math.sin(z*.0017 + x*.0004) +
        b*.8 > 1.15
    ){
        return "snow";
    }

    if(
        Math.cos(x*.0014 - z*.0007) +
        b*.5 < -0.95
    ){
        return "desert";
    }

    return "forest";
}


function riverValue(x,z){

    const a =
        Math.sin(
            x*.006 +
            Math.sin(z*.002)*3
        );

    const b =
        Math.sin(
            z*.0032 +
            x*.0015
        );

    return Math.abs(
        a*.65 + b*.35
    );
}


function isRiver(x,z){

    return riverValue(x,z) < .035;
}



// ============================================================
// MOUNTAIN NOISE
// ============================================================
// Lightweight multi-octave terrain noise. No external dependency.
function mountainNoise(x,z){

    let value = 0;
    let amplitude = 1;
    let frequency = 0.0018;
    let total = 0;

    for(let octave=0; octave<4; octave++){

        value +=
            (
                noise(
                    x * frequency,
                    z * frequency
                ) * 2 - 1
            ) * amplitude;

        total += amplitude;

        amplitude *= .5;
        frequency *= 2;
    }

    // Shape the noise so it creates broad rugged rises
    // rather than sharp artificial spikes.
    const normalized =
        value / total;

    return (
        Math.sign(normalized) *
        Math.pow(
            Math.abs(normalized),
            1.35
        )
    ) * 3.2;
}

function terrainHeight(x,z){

    const biome = biomeAt(x,z);

    // Broad rolling landforms.
    let h =
        Math.sin(x*.0027) *
        Math.cos(z*.0023) *
        4.2;

    // Secondary ridges.
    h +=
        Math.sin(
            x*.0062 +
            Math.sin(z*.004)
        ) *
        1.55;

    h +=
        Math.cos(
            z*.0091 -
            x*.003
        ) *
        .75;

    // Fine irregularity.
    h +=
        Math.sin(x*.021 + z*.014) *
        .28;

    h +=
        mountainNoise(x,z);

    if(biome === "desert")
        h *= .42;

    if(biome === "snow")
        h *= .78;

    const rv =
        riverValue(x,z);

    if(rv < .065){

        const depth =
            THREE.MathUtils.mapLinear(
                rv,
                0,
                .065,
                1.35,
                0
            );

        h -= depth;
    }

    return THREE.MathUtils.clamp(
        h,
        -4,
        15
    );
}

function mergeStaticGeometries(geometries){

    const positions = [];
    const normals = [];

    for(const geometry of geometries){

        const g =
            geometry.index
                ? geometry.toNonIndexed()
                : geometry.clone();

        const position =
            g.attributes.position;

        const normal =
            g.attributes.normal;

        for(let i=0;i<position.count;i++){

            positions.push(
                position.getX(i),
                position.getY(i),
                position.getZ(i)
            );

            normals.push(
                normal.getX(i),
                normal.getY(i),
                normal.getZ(i)
            );
        }

        g.dispose();
    }

    const merged =
        new THREE.BufferGeometry();

    merged.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    merged.setAttribute(
        "normal",
        new THREE.Float32BufferAttribute(
            normals,
            3
        )
    );

    merged.computeBoundingSphere();

    return merged;
}


function createPineTree(
    x,
    y,
    z,
    scale,
    snowy=false
){

    const g =
        new THREE.Group();

    g.userData.castShadows = false;

    // One trunk draw call.
    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .25*scale,
                .48*scale,
                4.5*scale,
                7
            ),
            bark
        );

    trunk.position.y =
        2.25*scale;

    g.add(trunk);


    // Merge all foliage layers into ONE geometry.
    const foliageGeometries = [];

    for(let i=0;i<4;i++){

        const radius =
            (2.5 - i*.42)*scale;

        const cone =
            new THREE.ConeGeometry(
                radius,
                (3.3 - i*.15)*scale,
                8
            );

        cone.translate(
            0,
            (4+i*1.25)*scale,
            0
        );

        foliageGeometries.push(
            cone
        );
    }

    const foliage =
        new THREE.Mesh(
            mergeStaticGeometries(
                foliageGeometries
            ),
            snowy
                ? snowLeaves
                : leaves
        );

    g.add(foliage);

    g.position.set(x,y,z);

    g.rotation.y =
        rand(
            Math.floor(x),
            Math.floor(z),
            0,
            Math.PI*2,
            44
        );

    return g;
}

function createOakTree(
    x,
    y,
    z,
    scale
){

    const g =
        new THREE.Group();

    g.userData.castShadows = false;

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .3*scale,
                .55*scale,
                5*scale,
                7
            ),
            barkDark
        );

    trunk.position.y =
        2.5*scale;

    g.add(trunk);


    const leafGeometries = [];

    for(let i=0;i<6;i++){

        const leaf =
            new THREE.IcosahedronGeometry(
                (1.6 + rand(
                    x+i,
                    z-i,
                    -.3,
                    .5,
                    22
                ))*scale,
                0
            );

        leaf.translate(
            (Math.sin(i*2.7)*1.4)*scale,
            (4.8 + (i%3)*.7)*scale,
            (Math.cos(i*1.8)*1.4)*scale
        );

        leafGeometries.push(
            leaf
        );
    }

    const foliage =
        new THREE.Mesh(
            mergeStaticGeometries(
                leafGeometries
            ),
            leaves
        );

    g.add(foliage);

    g.position.set(
        x,y,z
    );

    return g;
}

function addChunkCollider(cx, cz, collider){

    const key = `${cx},${cz}`;

    if(!chunkColliders.has(key))
        chunkColliders.set(key, []);

    chunkColliders.get(key).push(collider);
}


function addTreeCollider(cx, cz, x, z, radius){

    addChunkCollider(cx, cz, {
        type: "circle",
        x,
        z,
        radius
    });
}


function addWallCollider(
    cx, cz,
    x, z,
    halfX, halfZ,
    rotation
){

    addChunkCollider(cx, cz, {
        type: "box",
        x,
        z,
        halfX,
        halfZ,
        rotation
    });
}


function addHouseColliders(
    cx,
    cz,
    x,
    z,
    type,
    rotation
){

    const add = (
        lx,
        lz,
        hx,
        hz
    ) => {

        const c =
            Math.cos(rotation);

        const s =
            Math.sin(rotation);

        const wx =
            x + lx*c - lz*s;

        const wz =
            z + lx*s + lz*c;

        addWallCollider(
            cx,
            cz,
            wx,
            wz,
            hx,
            hz,
            rotation
        );
    };


    // Exterior walls.
    add(
        0,
        -6,
        7.6,
        .20
    );

    add(
        -7.6,
        0,
        .20,
        6
    );

    add(
        7.6,

        .20,
        6
    );


    // Front wall with a proper 3m doorway.
    add(
        -5,

    );

    );

        .16,
        .16
    );

    add(
        -2.8,
        -.2,
        2.9,
        .12
    );
}

function resolveCircleVsBox(
    px, pz, radius, box
){

    const c = Math.cos(-box.rotation);
    const s = Math.sin(-box.rotation);

    const dx = px - box.x;
    const dz = pz - box.z;

    // Convert player position into the wall's local coordinates.
    const lx = dx*c - dz*s;
    const lz = dx*s + dz*c;

    const closestX =
        THREE.MathUtils.clamp(
            lx,
            -box.halfX,
            box.halfX
        );

    const closestZ =
        THREE.MathUtils.clamp(
            lz,
            -box.halfZ,
            box.halfZ
        );

    let ox = lx - closestX;
    let oz = lz - closestZ;

    const distSq = ox*ox + oz*oz;

    if(distSq < radius*radius){

        let nx, nz, push;

        if(distSq > 0.000001){

            const dist = Math.sqrt(distSq);

            nx = ox / dist;
            nz = oz / dist;

            push = radius - dist;

        } else {

            // Player center is inside the wall rectangle.
            const toX =
                box.halfX - Math.abs(lx);

            const toZ =
                box.halfZ - Math.abs(lz);

            if(toX < toZ){

                nx = lx >= 0 ? 1 : -1;
                nz = 0;
                push = radius + toX;

            } else {

                nx = 0;
                nz = lz >= 0 ? 1 : -1;
                push = radius + toZ;
            }
        }

        // Convert push direction back to world coordinates.
        const wx = nx*c + nz*s;
        const wz = -nx*s + nz*c;

        return {
            x: px + wx*push,
            z: pz + wz*push
        };
    }

    return null;
}


function resolveCircleVsCircle(
    px, pz, radius, collider
){

    const dx = px - collider.x;
    const dz = pz - collider.z;

    const minDist =
        radius + collider.radius;

    const distSq =
        dx*dx + dz*dz;

    if(
        distSq < minDist*minDist
    ){

        if(distSq < 0.000001){

            return {
                x: px + minDist,
                z: pz
            };

        }

        const dist =
            Math.sqrt(distSq);

        const push =
            minDist - dist;

        return {
            x:
                px + (dx/dist)*push,
            z:
                pz + (dz/dist)*push
        };
    }

    return null;
}


function resolveWorldCollisions(
    x,
    z
){

    let px = x;
    let pz = z;

    const pcx =
        Math.floor(
            camera.position.x / CHUNK_SIZE
        );

    const pcz =
        Math.floor(
            camera.position.z / CHUNK_SIZE
        );

    // Only nearby chunks need collision checks.
    for(
        let cx = pcx-1;
        cx <= pcx+1;
        cx++
    ){

        for(
            let cz = pcz-1;
            cz <= pcz+1;
            cz++
        ){

            const list =
                chunkColliders.get(
                    `${cx},${cz}`
                );

            if(!list)
                continue;

            // Multiple passes resolve cases where two walls/trees
            // push the player into another collider.
            for(let pass=0; pass<3; pass++){

                for(
                    const collider of list
                ){

                    const result =
                        collider.type === "circle"
                            ? resolveCircleVsCircle(
                                px,
                                pz,
                                PLAYER_RADIUS,
                                collider
                            )
                            : resolveCircleVsBox(
                                px,
                                pz,
                                PLAYER_RADIUS,
                                collider
                            );

                    if(result){

                        px = result.x;
                        pz = result.z;
                    }
                }
            }
        }
    }

    return { x:px, z:pz };
}

function addBox(
    parent,
    sx,sy,sz,
    x,y,z,
    material
){

    const m =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,sy,sz
            ),
            material
        );

    m.position.set(
        x,y,z
    );

    m.castShadow =
        parent.userData.castShadows !== false;

    m.receiveShadow = true;

    parent.add(m);

    return m;
}

// ============================================================
// RIVER
// ============================================================

function createRiverSegment(cx,cz){

    const group =
        new THREE.Group();

    const baseX =
        cx * CHUNK_SIZE;

    const baseZ =
        cz * CHUNK_SIZE;

    const left = [];
    const right = [];

    // Build one continuous ribbon through the chunk.
    // The centerline is sampled from the same deterministic river field
    // used by terrainHeight(), so it remains stable between chunks.

    const samples = 26;

    for(let i=0;i<samples;i++){

        const x =
            baseX - CHUNK_SIZE/2 +
            (i/(samples-1))*CHUNK_SIZE;

        let bestZ = baseZ;
        let best = Infinity;

        for(let dz=-48;dz<=48;dz+=1.5){

            const z = baseZ + dz;
            const v = Math.abs(riverValue(x,z));

            if(v < best){
                best = v;
                bestZ = z;
            }
        }

        if(best < .075){

            // Estimate the river direction so the ribbon width
            // follows the curve rather than making square tiles.
            const i2 = Math.min(i+1,samples-1);
            const x2 =
                baseX - CHUNK_SIZE/2 +
                (i2/(samples-1))*CHUNK_SIZE;

            let nextZ = bestZ;

            for(let dz=-48;dz<=48;dz+=1.5){

                const z = baseZ + dz;
                const v = Math.abs(riverValue(x2,z));

                if(v < Math.abs(riverValue(x2,nextZ)))
                    nextZ = z;
            }

            const dx = x2-x;
            const dz = nextZ-bestZ;
            const len = Math.max(.001,Math.hypot(dx,dz));

            const nx = -dz/len;
            const nz = dx/len;

            const width =
                best < .035 ? 4.5 : 2.4;

            const y =
                terrainHeight(x,bestZ)+.045;

            left.push(
                new THREE.Vector3(
                    x + nx*width,
                    y,
                    bestZ + nz*width
                )
            );

            right.push(
                new THREE.Vector3(
                    x - nx*width,
                    y,
                    bestZ - nz*width
                )
            );
        }
    }

    if(left.length >= 2){

        const vertices = [];
        const indices = [];

        for(let i=0;i<left.length;i++){

            vertices.push(
                left[i].x,
                left[i].y,
                left[i].z,

                right[i].x,
                right[i].y,
                right[i].z
            );

            if(i < left.length-1){

                const a = i*2;
                const b = i*2+1;
                const c = i*2+2;
                const d = i*2+3;

                indices.push(
                    a,b,c,
                    b,d,c
                );
            }
        }

        const geo =
            new THREE.BufferGeometry();

        geo.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(
                vertices,
                3
            )
        );

        geo.setIndex(indices);
        geo.computeVertexNormals();

        const water =
            new THREE.Mesh(
                geo,
                riverMaterial
            );

        water.receiveShadow = true;

        group.add(water);
    }

    return group;
}

// ============================================================
// CHUNK GENERATION
// ============================================================

function generateChunk(
    cx,
    cz
){

    const key =
        `${cx},${cz}`;

    if(chunks.has(key))
        return;


    const chunk =
        new THREE.Group();

    const baseX =
        cx*CHUNK_SIZE;

    const baseZ =
        cz*CHUNK_SIZE;

    // All vegetation/water uses world coordinates.
    // Terrain vertices stay local and are translated by ground.position below.


    // --------------------------------------------------------
    // TERRAIN
    // --------------------------------------------------------

    const geo =
        new THREE.PlaneGeometry(
            CHUNK_SIZE,
            CHUNK_SIZE,
            28,
            28
        );

    geo.rotateX(-Math.PI/2);


    const pos =
        geo.attributes.position;


    for(
        let i=0;
        i<pos.count;
        i++
    ){

        const lx =
            pos.getX(i);

        const lz =
            pos.getZ(i);

        const wx =
            baseX+lx;

        const wz =
            baseZ+lz;

        pos.setY(
            i,
            terrainHeight(
                wx,wz
            )
        );
    }


    geo.computeVertexNormals();


    const centerBiome =
        biomeAt(
            baseX,
            baseZ
        );


    const ground =
        new THREE.Mesh(
            geo,
            centerBiome === "desert"
                ? desertGround
                : centerBiome === "snow"
                    ? snowGround
                    : forestGround
        );

    // IMPORTANT: PlaneGeometry coordinates are local to the chunk.
    // Move the completed terrain mesh into its actual world chunk.
    ground.position.set(
        baseX,
        0,
        baseZ
    );

    ground.receiveShadow=true;

    chunk.add(ground);


    // --------------------------------------------------------
    // RIVER
    // --------------------------------------------------------

    chunk.add(
        createRiverSegment(
            cx,cz
        )
    );


    // --------------------------------------------------------
    // VEGETATION
    // --------------------------------------------------------

    const count =
        centerBiome === "desert"
            ? 7
            : centerBiome === "snow"
                ? 9
                : 12;


    for(
        let i=0;
        i<count;
        i++
    ){

        const sx =
            cx*1000 +
            i*31 +
            11;

        const sz =
            cz*1000 +
            i*73 +
            19;


        const x =
            baseX +
            rand(
                sx,
                sz,
                -46,
                46,
                1
            );

        const z =
            baseZ +
            rand(
                sz,
                sx,
                -46,
                46,
                2
            );


        if(
            Math.abs(x)<22 &&
            Math.abs(z)<22
        ) continue;


        const y =
            terrainHeight(
                x,z
            );


        if(isRiver(x,z))
            continue;


        if(
            centerBiome === "desert"
        ){

            if(
                hash(sx,sz,7) > .3
            ){

                const cactusScale =
                    rand(
                        sx,
                        sz,
                        .6,
                        1.7,
                        8
                    );

                chunk.add(
                    createCactus(
                        x,y,z,
                        cactusScale
                    )
                );

                addTreeCollider(
                    cx, cz,
                    x, z,
                    .55 * cactusScale
                );

            }else{

                chunk.add(
                    createRock(
                        x,y,z,
                        rand(
                            sx,
                            sz,
                            .3,
                            1.2,
                            9
                        )
                    )
                );
            }

        }

        else if(
            centerBiome === "snow"
        ){

            chunk.add(
                createPineTree(
                    x,y,z,
                    rand(
                        sx,
                        sz,
                        .7,
                        1.6,
                        11
                    ),
                    true
                )
            );

        }

        else{

            if(
                hash(sx,sz,14) > .35
            ){

                const treeScale =
                    rand(
                        sx,
                        sz,
                        .65,
                        1.35,
                        12
                    );

                chunk.add(
                    createOakTree(
                        x,y,z,
                        treeScale
                    )
                );

                addTreeCollider(
                    cx, cz,
                    x, z,
                    .65 * treeScale
                );

            }else{

                const treeScale =
                    rand(
                        sx,
                        sz,
                        .7,
                        1.5,
                        13
                    );

                chunk.add(
                    createPineTree(
                        x,y,z,
                        treeScale
                    )
                );

                addTreeCollider(
                    cx, cz,
                    x, z,
                    .55 * treeScale
                );
            }
        }
    }


    // --------------------------------------------------------
    // HOUSES
    // --------------------------------------------------------

    const houseChance =
        hash(
            cx+5000,
            cz-5000,
            50
        );


    if(
        houseChance > .62
    ){

        const hx =
            baseX +
            rand(
                cx,
                cz,
                -25,
                25,
                80
            );

        const hz =
            baseZ +
            rand(
                cz,
                cx,
                -25,
                25,
                81
            );


        if(!isRiver(hx,hz)){

            const typeRoll =
                hash(
                    cx,
                    cz,
                    82
                );


            let type;


            if(
                centerBiome === "desert"
            ){

                type="desert";

            }else if(
                centerBiome === "snow"
            ){

                type="snow";

            }else{

                type =
                    typeRoll>.55
                        ? "barn"
                        : "cabin";
            }


            const house =
                createHouse(
                    hx,
                    terrainHeight(hx,hz),
                    hz,
                    type,
                    centerBiome,
                    rand(
                        cx,
                        cz,
                        0,
                        Math.PI*2,
                        83
                    )
                );


            chunk.add(house);

            addHouseColliders(
                cx,
                cz,
                hx,
                hz,
                type,
                house.rotation.y
            );


            // NPC near house
            if(
                hash(
                    cx,
                    cz,
                    90
                )>.45
            ){

                const npcId =
                    `${cx}:${cz}:npc`;


                if(
                    !generatedNPCIds.has(npcId)
                ){

                    createNPC(
                        hx+
                        rand(
                            cx,
                            cz,
                            -8,
                            8,
                            91
                        ),

                        terrainHeight(
                            hx,hz
                        ),

                        hz+
                        rand(
                            cz,
                            cx,
                            -8,
                            8,
                            92
                        ),

                        npcId
                    );
                }
            }
        }
    }


    // --------------------------------------------------------
    // EXTRA NPC
    // --------------------------------------------------------

    if(
        hash(cx,cz,99)>.75
    ){

        const nx =
            baseX+
            rand(
                cx,
                cz,
                -35,
                35,
                100
            );

        const nz =
            baseZ+
            rand(
                cz,
                cx,
                -35,
                35,
                101
            );


        const id =
            `${cx}:${cz}:wanderer`;


        if(
            !generatedNPCIds.has(id)
        ){

            createNPC(
                nx,
                terrainHeight(nx,nz),
                nz,
                id
            );
        }
    }


    scene.add(chunk);

    chunks.set(
        key,
        chunk
    );
}


// ============================================================
// CHUNK UNLOADING
// ============================================================

function disposeObject(
    object
){

    /*
      IMPORTANT:
      Most world materials are shared between many chunks.
      Disposing a shared material when ONE chunk unloads
      makes every other chunk turn black/invisible.

      We therefore dispose geometries here, but keep the
      shared materials alive for the lifetime of the world.
    */

    object.traverse(
        child=>{

            if(child.geometry)
                child.geometry.dispose();

        }
    );
}


function updateChunks(){

    const pcx =
        Math.floor(
            camera.position.x /
            CHUNK_SIZE
        );

    const pcz =
        Math.floor(
            camera.position.z /
            CHUNK_SIZE
        );


    // Generate closest missing chunks first, with a small per-frame
    // budget. This prevents a giant hitch when crossing a chunk boundary.
    const missing = [];

    for(
        let x=pcx-VIEW_DISTANCE;
        x<=pcx+VIEW_DISTANCE;
        x++
    ){

        for(
            let z=pcz-VIEW_DISTANCE;
            z<=pcz+VIEW_DISTANCE;
            z++
        ){

            const key =
                `${x},${z}`;

            if(!chunks.has(key)){

                const dx=x-pcx;
                const dz=z-pcz;

                missing.push({
                    x,
                    z,
                    distance:
                        dx*dx + dz*dz
                });
            }
        }
    }

    missing.sort(
        (a,b)=>
            a.distance-b.distance
    );

    // At most 1 heavy chunk build per frame.
    for(
        let i=0;
        i<Math.min(1,missing.length);
        i++
    ){

        generateChunk(
            missing[i].x,
            missing[i].z
        );
    }


    for(
        const [key,chunk]
        of chunks
    ){

        const [cx,cz] =
            key
                .split(",")
                .map(Number);


        if(
            Math.max(
                Math.abs(cx-pcx),
                Math.abs(cz-pcz)
            ) >
            VIEW_DISTANCE+1
        ){

            scene.remove(chunk);

            disposeObject(chunk);

            chunkColliders.delete(key);

            chunks.delete(key);
        }
    }
}

const keys={};

document.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;


        if(e.code==="KeyF")
            toggleFlashlight();

        if(e.code==="KeyL")
            saveGame();

        if(e.code==="KeyO")
            loadGame();
    }
);


document.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


const velocity =
    new THREE.Vector3();


function updatePlayer(
    delta
){

    const speed =
        keys.ShiftLeft ||
        keys.ShiftRight
            ? SPRINT_SPEED
            : WALK_SPEED;


    let forward=0;
    let side=0;


    if(keys.KeyW)
        forward+=1;

    if(keys.KeyS)
        forward-=1;

    if(keys.KeyA)
        side-=1;

    if(keys.KeyD)
        side+=1;


    const length =
        Math.hypot(
            forward,
            side
        );


    if(length>0){

        forward/=length;
        side/=length;

        const distance =
            speed * developerSpeedMultiplier * delta;

        // Build the desired world-space movement first.
        const forwardVector =
            new THREE.Vector3();

        camera.getWorldDirection(
            forwardVector
        );

        forwardVector.y = 0;

        if(forwardVector.lengthSq() > 0)
            forwardVector.normalize();

        // Camera-right vector.
        // The previous version had this sign reversed, which made
        // D move left and A move right.
        const rightVector =
            new THREE.Vector3(
                -forwardVector.z,
                0,
                forwardVector.x
            );

        const desiredX =
            camera.position.x +
            forwardVector.x * forward * distance +
            rightVector.x * side * distance;

        const desiredZ =
            camera.position.z +
            forwardVector.z * forward * distance +
            rightVector.z * side * distance;

        const resolved =
            developerGodMode
                ? {x: desiredX, z: desiredZ}
                : resolveWorldCollisions(
                    desiredX,
                    desiredZ
                );

        camera.position.x =
            resolved.x;

        camera.position.z =
            resolved.z;
    }


    // terrain collision
    const ground =
        terrainHeight(
            camera.position.x,
            camera.position.z
        );


    const desired =
        ground +
        PLAYER_HEIGHT + .12;


    camera.position.y +=
        (
            desired -
            camera.position.y
        ) *
        Math.min(
            1,
            delta*10
        );
}

function updateNPCs(delta){

    for(
        const npc of npcs
    ){

        npc.userData.timer -= delta;


        if(
            npc.userData.timer<=0
        ){

            npc.userData.timer =
                rand(
                    npc.userData.id.length,
                    Math.floor(
                        npc.position.x
                    ),
                    2,
                    8,
                    121
                );

            npc.userData.direction =
                rand(
                    Math.floor(
                        npc.position.x
                    ),
                    Math.floor(
                        npc.position.z
                    ),
                    0,
                    Math.PI*2,
                    122
                );
        }


        const dir =
            npc.userData.direction;

        const speed =
            npc.userData.speed;


        npc.position.x +=
            Math.sin(dir) *
            speed *
            delta;

        npc.position.z +=
            Math.cos(dir) *
            speed *
            delta;


        npc.position.y =
            terrainHeight(
                npc.position.x,
                npc.position.z
            );


        npc.rotation.y =
            dir;


        const body =
            npc.children[0];

        if(body){

            body.position.y =
                1.15 +
                Math.sin(
                    performance.now()*.006
                )*.025;
        }
    }
}


// ============================================================
// DAY/NIGHT
// ============================================================

function updateDayNight(
    delta
){

    worldTime +=
        delta*.025;


    if(worldTime>=24)
        worldTime-=24;


    /*
        0  = midnight
        6  = sunrise
        12 = noon
        18 = sunset
        24 = midnight
    */

    const angle =
        (
            worldTime/24
        ) *
        Math.PI*2;


    const sunY =
        Math.sin(
            angle -
            Math.PI/2
        );


    const sunX =
        Math.cos(angle);


    sun.position.set(
        sunX*250,
        sunY*250,
        80
    );


    const daylight =
        THREE.MathUtils.clamp(
            sunY*.9+.25,
            .05,
            1
        );


    sun.intensity =
        daylight * 3.2;


    // Keep a small amount of moon/sky fill at night so
    // trees, houses and NPCs remain visible.
    skyLight.intensity =
        .45 +
        daylight * 1.45;


    const dayColor =
        new THREE.Color(
            0x86b9dc
        );

    const nightColor =
        new THREE.Color(
            0x071226
        );


    scene.background =
        nightColor.clone().lerp(
            dayColor,
            daylight
        );


    scene.fog.color =
        scene.background;


    renderer.toneMappingExposure =
        .65 +
        daylight*.55;


    const hours =
        Math.floor(worldTime);

    const minutes =
        Math.floor(
            (worldTime-hours)*60
        );


    document.getElementById(
        "info"
    ).innerHTML =
        `<br>Biome: ${
            biomeAt(
                camera.position.x,
                camera.position.z
            ).toUpperCase()
        }<br>`+
        `Time: ${
            String(hours).padStart(2,"0")
        }:${
            String(minutes).padStart(2,"0")
        }<br>`+
        `Position: ${
            Math.floor(camera.position.x)
        }, ${
            Math.floor(camera.position.z)
        }`;
}

}


function loadGame(){

    const raw =
        localStorage.getItem(
            SAVE_KEY
        );


    if(!raw){

        showStatus(
            "NO SAVE FOUND"
        );

        return;
    }


    try{

        const save =
            JSON.parse(raw);


        camera.position.set(
            save.x,
            save.y,
            save.z
        );


        camera.rotation.y =
            save.rotationY || 0;

        camera.rotation.x =
            save.rotationX || 0;


        worldTime =
            save.worldTime ??
            8;


        flashlightOn =
            !!save.flashlightOn;


        flashlight.intensity =
            flashlightOn
                ? 160
                : 0;


        updateChunks();


        showStatus(
            "GAME LOADED"
        );

    }catch(e){

        showStatus(
            "SAVE FILE CORRUPTED"
        );
    }
}

function updateSettingsLabels(){

function applyGraphicsSettings(){

    rendererQuality =
        document.getElementById("quality").value;

    resolutionScale =
        Number(
            document.getElementById("resolutionScale").value
        ) / 100;

    viewDistanceSetting =
        Number(
            document.getElementById("viewDistance").value
        );

    VIEW_DISTANCE =
        THREE.MathUtils.clamp(
            viewDistanceSetting,
            1,
            3
        );

    shadowsEnabled =
        document.getElementById("shadows").value === "on";

    fogEnabled =
        document.getElementById("fog").value === "on";


    // Graphics quality controls renderer pixel density.
    const qualityScale = {
        low: .65,
        medium: .9,
        high: 1.15,
        ultra: 1.35
    }[rendererQuality] || .9;

    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio * qualityScale * resolutionScale,
            1.35
        )
    );

    renderer.shadowMap.enabled =
        shadowsEnabled;

    sun.castShadow =
        shadowsEnabled;


    if(fogEnabled){

        scene.fog =
            scene.fog ||
            new THREE.Fog(
                scene.background,
                120,
                600
            );

        scene.fog.near = 90;
        scene.fog.far = 360;

    }else{

        scene.fog = null;
    }


    showStatus("GRAPHICS SETTINGS APPLIED");

    closeSettings();
}
